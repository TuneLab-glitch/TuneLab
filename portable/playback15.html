<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TuneLab · Global Datalog Playback</title><style>body{font:15px Segoe UI,sans-serif;background:#151b23;color:#edf0f4;padding:16px}label{display:block;margin:10px 0}select,button,input{font:inherit;padding:8px}button{margin:4px}input[type=range]{width:95%}output{display:block;border:2px solid #50b9b0;padding:12px;margin:12px 0}button:disabled,select:disabled,input:disabled{opacity:.5}</style><h1>Global Datalog Playback</h1><p>This window controls playback in your main TuneLab window.</p><label>Active Datalog<select id="active"></select></label><div><button data-step="first">First</button><button data-step="-1">Previous</button><button id="play">Play</button><button data-step="1">Next</button><button data-step="last">Last</button><label>Speed<select id="speed"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select></label></div><label>Playback Position<input id="position" type="range" min="0" max="0" step="1"></label><label>Command Pressure Units<select id="unit"><option value="">Use Datalog/Header Units</option><option value="bar">Absolute bar</option><option value="kpa">Absolute kPa</option><option value="psi">Exported PSI representation</option></select></label><output id="status" role="status">Connecting to the main window…</output><button id="reconnect">Reconnect</button><button id="dock">Return Player to Main Window</button><script src="playback-window15.js"></script></html>
